[build]
target = "thumbv6m-none-eabi"

[target.thumbv6m-none-eabi]
runner = "tools/run.sh"
rustflags = [
  "-C", "link-arg=--nmagic",
  "-C", "link-arg=-Tlink.x",
  "-C", "link-arg=-Tdefmt.x",
]

[env]
DEFMT_LOG = "trace"

[alias]
# 'cargo flash' = 'cargo run --release' with the runner swapped for the
# flash-only one, so it builds and uploads but starts no defmt session.
flash = ["run", "--release", "--config", "target.thumbv6m-none-eabi.runner='tools/flash.sh'"]
